# Dual-publish: one git tag → one tarball → npm + GitHub Release.
#
# Human steps:
#   1. Bump package.json version, fill CHANGELOG.md, merge to main.
#   2. git tag -a vX.Y.Z -m vX.Y.Z && git push origin vX.Y.Z
#   3. This workflow packs once, publishes that file to npm, then attaches
#      the same bytes to the GitHub Release (versioned + stable names).
#   Recovery: if a step fails, fix it on main, then run this workflow by hand
#   (Actions → Release → Run workflow) and pass the existing tag in `tag`.
#   A version already on npm is skipped, never republished, so a retry can
#   finish the GitHub Release without moving the tag.
#
# Auth is npm Trusted Publishing (OIDC) — there is no NPM_TOKEN anywhere.
# `actions/setup-node` must NOT be given `registry-url`: that input writes an
# .npmrc containing `_authToken=${NODE_AUTH_TOKEN}` and exports a dummy
# `NODE_AUTH_TOKEN` sentinel, so npm sends a bogus token instead of exchanging
# the OIDC token. The registry rejects it and npm reports the failure as
# `E404 ... you do not have permission` — a misleading auth error. The guard
# step below fails loudly if such a token ever reappears.
#
# First-time npm setup (Trusted Publishing, no NPM_TOKEN):
#   npmjs.com → package (or unpublished name) → Trusted Publisher
#     Organization or user: lisongxuan
#     Repository: ds-hentai
#     Workflow filename: release.yml
#     Environment name: (leave empty; this job does not use an environment)
#     Allowed actions: npm publish
#   Requires a public repo and npm CLI ≥ 11.5.1 (Node ≥ 22.14).
#
# Reading a failure. npm's OIDC helper (lib/utils/oidc.js) never throws: when
# the id_token is unavailable, or the registry refuses the token exchange, it
# returns undefined, logs only at `verbose`, and `npm publish` then dies with a
# bare `npm error code ENEEDAUTH ... need auth`. That message therefore means
# "trusted publishing did not happen", never "the package is not mine". The
# steps below turn each silent cause into an actionable error:
#   - "Require npm CLI that supports Trusted Publishing" — npm < 11.5.1 has no
#     OIDC support at all, so it can never publish without a token.
#   - "Verify npm trusted publishing for this package" — performs the same
#     id_token exchange `npm publish` would, and prints the registry's own
#     answer (2xx = trusted publishing is live; 404 = no trusted publisher
#     matches this workflow/repo/env; 401 = GitHub refused the token or
#     `id-token: write` is missing). The endpoint answers 201 on success, so
#     the step accepts any 2xx rather than one specific code.
#   - The publish step re-runs once with `--loglevel=verbose` on failure, so
#     the registry's rejection body is visible in the log.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. v0.7.1'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      # github.event.inputs is part of the event payload, so this expression is
      # valid in every context (unlike the `inputs` context). Tag pushes leave
      # it empty and fall back to the tag name.
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      # Do not add `registry-url` here; see the note at the top of this file.
      # This job holds `id-token: write`, so dependency caching stays off.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Require npm CLI that supports Trusted Publishing
        run: |
          set -euo pipefail
          npm install -g npm@^11.5.1
          current="$(npm --version)"
          needed="11.5.1"
          # `sort -V` gives a real version compare; a plain string test would
          # accept e.g. 11.5.0, which predates trusted publishing.
          oldest="$(printf '%s\n%s\n' "$needed" "$current" | sort -V | head -n1)"
          if [ "$oldest" != "$needed" ]; then
            echo "::error::npm ${current} predates trusted publishing; npm >= ${needed} is required for OIDC publishing."
            exit 1
          fi
          echo "npm ${current} supports trusted publishing."

      - name: Assert nothing shadows OIDC trusted publishing
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::No OIDC token endpoint; this job needs 'id-token: write'."
            exit 1
          fi
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NODE_AUTH_TOKEN is set, so npm would publish with that token instead of trusted publishing. Remove it and any setup-node 'registry-url'."
            exit 1
          fi
          # Do not try `npm config get //registry.npmjs.org/:_authToken`: npm
          # refuses to print protected options ("the ... option is protected"),
          # so that check would silently never fire. Read the files instead.
          global_config="$(npm config get globalconfig 2>/dev/null || true)"
          for rc in "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}" "$PWD/.npmrc" "$global_config"; do
            [ -n "$rc" ] && [ -f "$rc" ] || continue
            if grep -qiE '^[[:space:]]*([^#]*:)?_authToken[[:space:]]*=' "$rc"; then
              echo "::error::$rc configures an _authToken for a registry. It shadows OIDC trusted publishing and makes the registry answer 404. Drop setup-node 'registry-url' and any token in that file."
              exit 1
            fi
          done
          echo "OK: no registry token configured; OIDC trusted publishing will be used."

      - name: Verify tag matches package.json
        id: meta
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          version="${tag#v}"
          pkg="$(node -p "require('./package.json').version")"
          name="$(node -p "require('./package.json').name")"
          if [ "$version" != "$pkg" ]; then
            echo "::error::Tag $tag does not match package.json version $pkg"
            exit 1
          fi
          if [[ "$version" == *-* ]]; then
            prerelease=true
            npm_tag=next
          else
            prerelease=false
            npm_tag=latest
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$npm_tag" >> "$GITHUB_OUTPUT"

      # Performs the same id_token exchange `npm publish` would, because npm
      # swallows the failure and reports only ENEEDAUTH. Runs before the slow
      # test steps so a config-only problem costs seconds instead of minutes.
      - name: Verify npm trusted publishing for this package
        env:
          NAME: ${{ steps.meta.outputs.name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${NAME}@${VERSION} is already on npm; only the GitHub Release remains."
            exit 0
          fi
          id_token="$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" \
            | node --input-type=commonjs -e '
              let body = ""
              process.stdin.on("data", (chunk) => { body += chunk })
              process.stdin.on("end", () => {
                let value
                try { value = JSON.parse(body).value } catch {}
                if (!value) {
                  console.error("GitHub returned no id_token for npm:registry.npmjs.org")
                  process.exit(1)
                }
                process.stdout.write(value)
              })
            ')"
          exchange="https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${NAME}"
          body_file="${RUNNER_TEMP:-/tmp}/npm-token-exchange.json"
          code="$(curl -sS -o "$body_file" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${id_token}" "${exchange}")"
          echo "id_token exchange for ${NAME} -> HTTP ${code}"
          # 201 Created is the success answer from this endpoint; accept any 2xx
          # so a status-code change cannot block a healthy publish. On error the
          # registry body explains itself, but a success body carries the
          # short-lived npm token, so only echo it when the exchange failed.
          if [ "${code}" -lt 200 ] || [ "${code}" -ge 300 ]; then
            echo "registry answer:"
            cat "$body_file" || true
            echo
          fi
          case "$code" in
            2??)
              echo "OK: npm recognizes this workflow as a trusted publisher for ${NAME}."
              ;;
            404)
              echo "::error::npm has no trusted publisher reachable for ${NAME} from this workflow."
              echo "Fix on npmjs.com -> ${NAME} -> Settings -> Trusted publishing (GitHub Actions):"
              echo "  Organization or user: lisongxuan"
              echo "  Repository:          ds-hentai"
              echo "  Workflow filename:   release.yml"
              echo "  Environment name:    (leave empty; this job declares none)"
              echo "  Allowed actions:     npm publish"
              exit 1
              ;;
            401|403)
              echo "::error::npm rejected the GitHub OIDC token for ${NAME}."
              echo "The job must keep 'id-token: write', and the trusted publisher's"
              echo "environment name must match this job's (both empty by default)."
              exit 1
              ;;
            *)
              echo "::error::npm id_token exchange returned HTTP ${code}."
              exit 1
              ;;
          esac

      - run: npm ci
      - run: npm test
      - run: npm run pack:check

      - name: Pack the publish tarball
        id: pack
        run: |
          set -euo pipefail
          tarball="$(npm pack | tail -n1)"
          test -f "$tarball"
          cp "$tarball" ds-hentai.tgz
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Publish the same tarball to npm
        env:
          NAME: ${{ steps.meta.outputs.name }}
          VERSION: ${{ steps.meta.outputs.version }}
          NPM_TAG: ${{ steps.meta.outputs.npm_tag }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -euo pipefail
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "npm already has ${NAME}@${VERSION}; skipping publish (re-run after a GitHub Release failure)"
          elif ! npm publish "./${TARBALL}" --access public --tag "$NPM_TAG"; then
            # The first attempt is quiet so a successful publish stays readable.
            # On failure, repeat it with verbose logging: that is the only way to
            # see the registry's token-exchange rejection, which npm otherwise
            # reduces to `ENEEDAUTH`.
            echo "::group::npm publish --loglevel=verbose (diagnostics)"
            npm publish "./${TARBALL}" --access public --tag "$NPM_TAG" --loglevel=verbose || true
            echo "::endgroup::"
            echo "::error::npm publish failed for ${NAME}@${VERSION}; see the verbose output above."
            exit 1
          fi
          # Never let a silent auth failure reach the Release step as a
          # publication that nobody noticed did not happen.
          for attempt in 1 2 3; do
            live="$(npm view "${NAME}@${VERSION}" version 2>/dev/null || true)"
            if [ "$live" = "$VERSION" ]; then
              echo "${NAME}@${VERSION} is live on the registry."
              exit 0
            fi
            echo "Waiting for ${NAME}@${VERSION} to appear (attempt ${attempt}/3)..."
            sleep 5
          done
          echo "::error::${NAME}@${VERSION} is not readable from the registry after publishing."
          exit 1

      - name: Extract CHANGELOG notes for this version
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          node --input-type=commonjs -e '
          const { readFileSync, writeFileSync } = require("node:fs");
          const version = process.env.VERSION;
          const md = readFileSync("CHANGELOG.md", "utf8");
          const escaped = version.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          const match = md.match(new RegExp("^## " + escaped + "\\r?\\n([\\s\\S]*?)(?=^## |\\s*$)", "m"));
          const body = (match ? match[1] : "").trim();
          const repo = process.env.GITHUB_REPOSITORY;
          const notes = [
            body || ("ds-hentai " + version),
            "",
            "Install (npm, prebuilt, no allowBuilds):",
            "",
            "```sh",
            "npx @deepseek-ai/dsh plugin --profile web add ds-hentai@" + version,
            "```",
            "",
            "Install (GitHub Release tarball):",
            "",
            "```sh",
            "npx @deepseek-ai/dsh plugin --profile web add https://github.com/" + repo + "/releases/download/v" + version + "/ds-hentai.tgz",
            "```",
            ""
          ].join("\n");
          writeFileSync("release-notes.md", notes);
          '

      - name: Create GitHub Release with the same tarball
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -euo pipefail
          extra=()
          if [ "$PRERELEASE" = true ]; then
            extra+=(--prerelease)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "./${TARBALL}#ds-hentai-${VERSION}.tgz" \
              "./ds-hentai.tgz#ds-hentai.tgz" \
              --clobber
          else
            gh release create "$TAG" \
              "./${TARBALL}#ds-hentai-${VERSION}.tgz" \
              "./ds-hentai.tgz#ds-hentai.tgz" \
              --title "$TAG" \
              --notes-file release-notes.md \
              "${extra[@]}"
          fi
